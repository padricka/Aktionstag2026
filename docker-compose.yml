services:
  redis:
    image: redis:7-alpine
    container_name: ak26-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ak26-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_IN_MEMORY_CHANNEL_LAYER=False
    volumes:
      # Leaderboard (JSON) übersteht so einen Neubau des Containers
      - leaderboard:/backend/data
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ak26-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  newman:
    image: postman/newman:alpine
    container_name: ak26-newman
    restart: "no"
    depends_on:
      - backend
    volumes:
      - ./postman:/etc/newman:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until wget -q -O /dev/null http://backend:8000/create-game/;
        do echo "warte auf backend..."; sleep 1; done;
        newman run drv_box_http.postman_collection.json
        --env-var baseUrl=http://backend:8000

volumes:
  leaderboard:
